name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile
        shell: cmd
        run: compile.cmd

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dsh-tray.exe
          generate_release_notes: true
